<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPB予想ボード</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="container">
    <div class="header-bar">
      <h1 id="app-title" class="season-selector">
        <span id="title-text">NPB順位予想</span>
        <button id="season-prev" class="season-nav" type="button">‹</button>
        <span id="season-text"></span>
        <button id="season-next" class="season-nav" type="button">›</button>
      </h1>

      <div id="updated-at" class="updated-at">
        最終更新：--
      </div>
    </div>

    <!-- 合計点 -->
    <div class="board-scroll board-scroll-top">
    <div class="board-content">
    <table class="total-score-table board-table">
      <thead id="total-score">
        <!-- JSで描画 -->
      </thead>
    </table>
    </div>
    </div>
    <!-- タブ -->
    <!-- 
    <div class="tabs">
        <div class="tab active" onclick="showLeague('central')">
            セ
        </div>
        <div class="tab" onclick="showLeague('pacific')">
            パ
        </div>
    </div>
    -->

    <div class="ranking-section-guide">
    <div>実際の順位</div>
    <div>順位予想</div>
    </div>

    <!-- セ・リーグ -->
    <div class="board-scroll board-scroll-bottom">
    <div class="board-content">
    <table class="board-table">
      <thead id="central-head">
        <!-- JSで描画 -->
      </thead>
      <tbody id="central-body"></tbody>
    </table>

    <!-- パ・リーグ -->
    <table class="board-table">
      <thead id="pacific-head">
        <!-- JSで描画 -->
      </thead>
      <tbody id="pacific-body"></tbody>
    </table>
    </div>
    </div>
    <div class="screen-spacer"></div>
    </div>
  </div>

  <!-- JS -->
  <script src="js/app.js"></script>
</body>
</html>
